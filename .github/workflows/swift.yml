name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify Airlift library
        run: |
          echo "Checking AirliftFFI..."
          ls -lh AirliftFFI/
          test -f AirliftFFI/libairlift_ffi.a
          test -f AirliftFFI/airlift.h

      - name: Make build script executable
        run: chmod +x ./ipabuild.sh

      - name: Build Erosion IPA
        run: ./ipabuild.sh

      - name: Verify IPA
        run: |
          echo "=== Generated files ==="
          find . -type f -name "*.ipa" -print

          test -f ./Erosion.ipa

          echo "=== IPA size ==="
          ls -lh ./Erosion.ipa

          echo "=== IPA contents ==="
          unzip -l ./Erosion.ipa | head -40

      - name: Upload Erosion IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: ./Erosion.ipa
          if-no-files-found: error
